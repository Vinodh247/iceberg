name: Iceberg Weekly Documentation Scan

on:
  schedule:
    - cron: '0 9 * * 1'  # Weekly on Mondays at 9 AM UTC
  workflow_dispatch:

jobs:
  scan-and-improve-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Iceberg
        uses: actions/checkout@v4
        with:
          repository: apache/iceberg
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml requests markdown

      - name: Run documentation scan
        run: python .github/scripts/scan_iceberg_docs.py

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'docs: automated documentation improvements and fixes'
          title: 'docs: weekly documentation maintenance'
          body: |
            ## Automated Documentation Scan Results

            This PR contains documentation improvements identified through automated scanning:

            - Missing API documentation stubs
            - Broken or outdated links
            - Formatting standardization
            - Missing contributor guides
            - Test documentation improvements

            **Please review** before merging. All suggestions can be modified or rejected.

            Generated by Iceberg Documentation Maintenance Bot
          branch: docs/weekly-maintenance
          delete-branch: true
          labels: 'documentation'
